<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Pilot</title>
<style>
  :root{
    --bg:#f4f5f8; --card:#ffffff; --line:#e6e8ee; --text:#0f1222; --muted:#6b7084;
    --chip:#ffffff; --chip-line:#dfe2ea; --ink:#141622; --ink-text:#ffffff;
    --hero:#2f49e0; --hero-text:#ffffff; --hero-sub:rgba(255,255,255,.82);
    --seg:rgba(255,255,255,.28); --seg-done:rgba(255,255,255,.78);
    --seg-active:linear-gradient(90deg,#ff7a45 0%,#ffb13d 100%);
    --ok:#1f8a4c; --ok-bg:#e4f5ea; --warn:#9a5b00; --warn-bg:#fff1d6; --drop:#8a1f2b; --drop-bg:#fbe3e6;
    --info:#2946c7; --info-bg:#e8ecfd; --neutral:#4b5063; --neutral-bg:#eef0f5;
    --radius:20px; --font:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0e1017; --card:#171a24; --line:#262a38; --text:#f2f3f7; --muted:#9a9fb3;
    --chip:#171a24; --chip-line:#2d3140; --ink:#f2f3f7; --ink-text:#0e1017;
    --hero:#2a40c4; --seg:rgba(255,255,255,.18); --seg-done:rgba(255,255,255,.7);
    --ok:#7ad39d; --ok-bg:#153223; --warn:#ffcc74; --warn-bg:#3a2b0e; --drop:#ff9aa6; --drop-bg:#3b161c;
    --info:#aebcff; --info-bg:#1e2750; --neutral:#c3c7d6; --neutral-bg:#232736;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 32px 48px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .logo b{background:var(--ink);color:var(--ink-text);padding:3px 9px;border-radius:9px;font-weight:800}
  .controls{display:flex;gap:10px;align-items:center}
  .seg-btns{display:flex;background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:3px;gap:2px}
  .seg-btns button,.icon-btn{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;
    height:34px;min-width:38px;padding:0 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .seg-btns button[aria-pressed="true"]{background:var(--ink);color:var(--ink-text)}
  .icon-btn{background:var(--chip);border:1px solid var(--chip-line);width:42px;height:42px;color:var(--text)}
  .icon-btn svg,.seg-btns svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:32px;line-height:1.15;margin:34px 0 12px;letter-spacing:-.02em;font-weight:700}
  .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
  .chip{background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:5px 12px;font-weight:600;color:var(--text);font-size:14px}
  .meta a{color:var(--info);text-decoration:none;font-weight:600}
  .hero{margin-top:22px;background:var(--hero);color:var(--hero-text);border-radius:26px;padding:28px 30px 26px;display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:start}
  .hero .label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .dot{width:11px;height:11px;border-radius:50%;background:#ff7a45;box-shadow:0 0 0 3px rgba(255,122,69,.35)}
  .hero h2{margin:12px 0 8px;font-size:36px;line-height:1.1;letter-spacing:-.02em;font-weight:800}
  .hero p{margin:0;color:var(--hero-sub);font-size:18px}
  .timer{text-align:right}
  .timer .t{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .timer .in{color:var(--hero-sub);font-size:15px;margin-top:8px}
  .phases{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
  .ph .bar{height:8px;border-radius:999px;background:var(--seg);overflow:hidden}
  .ph .bar i{display:block;height:100%;width:0;border-radius:999px}
  .ph.done .bar i{width:100%;background:var(--seg-done)}
  .ph.active .bar i{width:45%;background:var(--seg-active)}
  .ph.skipped .bar i{width:100%;background:repeating-linear-gradient(90deg,var(--seg-done) 0 6px,transparent 6px 10px)}
  .ph .n{font-size:14px;font-weight:600;margin-top:10px}
  .ph .s{font-size:13px;color:var(--hero-sub)}
  .ph.active .n{font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;min-width:0}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:700}
  .card.full{grid-column:1/-1}
  table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
  th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
  th{color:var(--muted);font-weight:600;border-top:0;font-size:13px;white-space:nowrap;overflow-wrap:normal}
  th.c-id{width:52px} th.c-st{width:96px} th.c-tk{width:90px}
  td.id{font-weight:700;white-space:nowrap;width:52px}
  .st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
  .st.neutral{background:var(--neutral-bg);color:var(--neutral)} .st.info{background:var(--info-bg);color:var(--info)}
  .st.warn{background:var(--warn-bg);color:var(--warn)} .st.ok{background:var(--ok-bg);color:var(--ok)} .st.drop{background:var(--drop-bg);color:var(--drop)}
  .empty{color:var(--muted);font-size:14px;padding:8px 0}
  .small{font-size:13px;color:var(--muted)}
  .log li{padding:6px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:12px}
  .log ul{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
  .log time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
  .kv a{color:var(--info);text-decoration:none}
  @media (max-width:820px){
    .wrap{padding:18px 16px 36px} h1{font-size:26px;margin-top:22px}
    .hero{grid-template-columns:1fr;padding:22px 20px} .hero h2{font-size:26px} .hero p{font-size:16px}
    .timer{text-align:left} .timer .t{font-size:40px}
    .phases{grid-template-columns:repeat(4,1fr)} .grid{grid-template-columns:1fr}
    .card{padding:18px 16px} table{table-layout:auto} th,td{padding:8px 6px} th.c-id,th.c-st,th.c-tk{width:auto} td.id{width:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">ERP <b>Pilot</b></div>
    <div class="controls">
      <button class="icon-btn" id="refresh" title="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <div class="seg-btns" id="theme">
        <button data-theme="light" aria-pressed="true" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button data-theme="dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <div class="seg-btns" id="lang">
        <button data-lang="ru" aria-pressed="true">RU</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>

  <section class="hero" id="hero"></section>

  <div class="grid">
    <section class="card"><h3 id="h-req"></h3><div id="req"></div></section>
    <section class="card"><h3 id="h-tickets"></h3><div id="tickets"></div></section>
    <section class="card"><h3 id="h-run"></h3><dl class="kv" id="run"></dl></section>
    <section class="card log"><h3 id="h-log"></h3><div id="log"></div></section>
  </div>
</div>

<script id="state" type="application/json">__STATE__</script>
<script>
(function(){
  var S = JSON.parse(document.getElementById('state').textContent);
  var I18N = {
    ru:{started:'начат', today:'сегодня в', ahead:'впереди', done:'готово', skipped:'пропущен', active:'идёт',
        inPhase:'в «%s»', req:'Требования', tickets:'Тикеты', run:'Прогон', log:'Журнал',
        thId:'№', thText:'Требование', thSt:'Статус', thTk:'Тикеты', thTitle:'Задача', thReq:'Треб.',
        empty:'Пока пусто — появится на этапе «%s».', repo:'Репозиторий', branch:'Ветка', pr:'PR',
        dash:'Дашборд', constraints:'Ограничения', finished:'завершён', mode:'Режим', depth:'Глубина',
        phase:{preflight:'Preflight',requirements:'Requirements',briefing:'Briefing',spec:'Spec',plan:'Plan',development:'Development',code_review:'Code review',acceptance:'Acceptance'},
        mode_v:{manual:'Ручной','semi-automatic':'Полуавтомат',automatic:'Автомат'},
        depth_v:{light:'Лёгкая глубина',normal:'Обычная глубина',deep:'Глубокая проверка'},
        rst:{open:'открыто',specified:'в спеке',planned:'в плане',implemented:'сделано',verified:'принято',dropped:'снято'},
        tst:{todo:'в очереди',in_progress:'в работе',review:'на ревью',done:'готово',dropped:'снят'}},
    en:{started:'started', today:'today at', ahead:'ahead', done:'done', skipped:'skipped', active:'now',
        inPhase:'in “%s”', req:'Requirements', tickets:'Tickets', run:'Run', log:'Log',
        thId:'#', thText:'Requirement', thSt:'Status', thTk:'Tickets', thTitle:'Ticket', thReq:'Req.',
        empty:'Nothing yet — appears in the “%s” phase.', repo:'Repository', branch:'Branch', pr:'PR',
        dash:'Dashboard', constraints:'Constraints', finished:'finished', mode:'Mode', depth:'Depth',
        phase:{preflight:'Preflight',requirements:'Requirements',briefing:'Briefing',spec:'Spec',plan:'Plan',development:'Development',code_review:'Code review',acceptance:'Acceptance'},
        mode_v:{manual:'Manual','semi-automatic':'Semi-automatic',automatic:'Automatic'},
        depth_v:{light:'Light depth',normal:'Normal depth',deep:'Deep check'},
        rst:{open:'open',specified:'specified',planned:'planned',implemented:'implemented',verified:'verified',dropped:'dropped'},
        tst:{todo:'todo',in_progress:'in progress',review:'review',done:'done',dropped:'dropped'}}
  };
  var RCLS={open:'neutral',specified:'info',planned:'info',implemented:'warn',verified:'ok',dropped:'drop'};
  var TCLS={todo:'neutral',in_progress:'warn',review:'info',done:'ok',dropped:'drop'};
  var lang = localStorage.getItem('pilot.lang') || document.documentElement.lang || 'ru';
  var theme = localStorage.getItem('pilot.theme') || 'light';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmt(s,v){return s.replace('%s',v);}
  function pad(n){return (n<10?'0':'')+n;}
  function hm(iso){var d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());}
  function dateLabel(iso){var d=new Date(iso),n=new Date(),T=I18N[lang];
    var same=d.toDateString()===n.toDateString();
    return same? T.today+' '+hm(iso) : d.toLocaleDateString(lang==='ru'?'ru-RU':'en-GB',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+hm(iso);}
  function dur(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
    return h? h+':'+pad(m)+':'+pad(sec) : m+':'+pad(sec);}
  function active(){for(var i=0;i<S.phases.length;i++) if(S.phases[i].status==='active') return S.phases[i]; return null;}
  function badge(cls,txt){return '<span class="st '+cls+'">'+esc(txt)+'</span>';}
  function link(u,t){return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t||u)+'</a>':esc(t||'—');}

  function render(){
    var T=I18N[lang], run=S.run;
    document.documentElement.lang=lang; document.documentElement.setAttribute('data-theme',theme);
    document.querySelectorAll('#lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
    document.querySelectorAll('#theme button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.theme===theme));});
    document.title='ERP Pilot — '+(run.title[lang]||run.title.ru);
    document.getElementById('title').textContent=run.title[lang]||run.title.ru;
    var meta='<span class="chip">'+esc(T.mode_v[run.mode]||run.mode)+'</span><span class="chip">'+esc(T.depth_v[run.depth]||run.depth)+'</span>'+
             '<span>'+esc(T.started+' '+dateLabel(run.started_at))+(run.finished_at?' · '+esc(T.finished+' '+dateLabel(run.finished_at)):'')+'</span>';
    document.getElementById('meta').innerHTML=meta;

    var a=active(), last=S.phases[S.phases.length-1];
    var cur=a||(last.status==='done'?last:S.phases[0]);
    var note=cur.note[lang]||cur.note.ru||['',''];
    var h='<div><div class="label"><span class="dot"></span>'+esc(T.phase[cur.id])+'</div><h2>'+esc(note[0])+'</h2><p>'+esc(note[1]||'')+'</p></div>'+
          '<div class="timer"><div class="t" id="timer">0:00</div><div class="in">'+esc(fmt(T.inPhase,T.phase[cur.id]))+'</div></div>'+
          '<div class="phases">'+S.phases.map(function(p){
            var sub;
            if(p.status==='active') sub='<span data-ph-timer>0:00</span>';
            else if(p.status==='done') sub=dur(new Date(p.finished_at)-new Date(p.started_at));
            else if(p.status==='skipped') sub=T.skipped; else sub=T.ahead;
            return '<div class="ph '+p.status+'"><div class="bar"><i></i></div><div class="n">'+esc(T.phase[p.id])+'</div><div class="s">'+sub+'</div></div>';
          }).join('')+'</div>';
    document.getElementById('hero').innerHTML=h;

    document.getElementById('h-req').textContent=T.req+' · '+S.requirements.length;
    document.getElementById('h-tickets').textContent=T.tickets+' · '+S.tickets.length;
    document.getElementById('h-run').textContent=T.run; document.getElementById('h-log').textContent=T.log;

    document.getElementById('req').innerHTML = S.requirements.length ?
      '<table><thead><tr><th class="c-id">'+T.thId+'</th><th>'+T.thText+'</th><th class="c-st">'+T.thSt+'</th><th class="c-tk">'+T.thTk+'</th></tr></thead><tbody>'+
      S.requirements.map(function(r){return '<tr><td class="id">'+esc(r.id)+'</td><td>'+esc(r.text)+(r.source?'<div class="small">'+esc(r.source)+'</div>':'')+'</td><td>'+badge(RCLS[r.status]||'neutral',T.rst[r.status]||r.status)+'</td><td>'+esc((r.tickets||[]).join(', ')||'—')+'</td></tr>';}).join('')+
      '</tbody></table>' : '<div class="empty">'+esc(fmt(T.empty,T.phase.requirements))+'</div>';

    document.getElementById('tickets').innerHTML = S.tickets.length ?
      '<table><thead><tr><th class="c-id">'+T.thId+'</th><th>'+T.thTitle+'</th><th class="c-st">'+T.thSt+'</th><th class="c-tk">'+T.thReq+'</th></tr></thead><tbody>'+
      S.tickets.map(function(t){return '<tr><td class="id">'+esc(t.id)+'</td><td>'+(t.url?link(t.url,t.title):esc(t.title))+'</td><td>'+badge(TCLS[t.status]||'neutral',T.tst[t.status]||t.status)+'</td><td>'+esc((t.requirements||[]).join(', ')||'—')+'</td></tr>';}).join('')+
      '</tbody></table>' : '<div class="empty">'+esc(fmt(T.empty,T.phase.plan))+'</div>';

    document.getElementById('run').innerHTML =
      '<dt>'+T.repo+'</dt><dd>'+link(run.repo?'https://github.com/'+run.repo:null,run.repo)+'</dd>'+
      '<dt>'+T.branch+'</dt><dd>'+esc(run.branch||'—')+'</dd>'+
      '<dt>'+T.pr+'</dt><dd>'+link(run.pr_url)+'</dd>'+
      '<dt>'+T.dash+'</dt><dd>'+link(run.dashboard_url)+'</dd>'+
      '<dt>'+T.constraints+'</dt><dd>'+((run.constraints||[]).map(esc).join('; ')||'—')+'</dd>';

    var lg=(S.log||[]).slice().reverse();
    document.getElementById('log').innerHTML = lg.length ? '<ul>'+lg.map(function(e){return '<li><time>'+esc(dateLabel(e.at))+'</time><span>'+esc(e.phase?'['+e.phase+'] ':'')+esc(e.event)+'</span></li>';}).join('')+'</ul>' : '<div class="empty">—</div>';
    tick();
  }
  function tick(){
    var a=active(), el=document.getElementById('timer'), ph=document.querySelector('[data-ph-timer]');
    if(!el) return;
    if(a){var d=dur(Date.now()-new Date(a.started_at)); el.textContent=d; if(ph) ph.textContent=d;}
    else { var p=S.phases[S.phases.length-1]; el.textContent = p.status==='done'? dur(new Date(S.run.finished_at||p.finished_at)-new Date(S.run.started_at)) : '0:00'; }
  }
  document.getElementById('lang').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; lang=b.dataset.lang; localStorage.setItem('pilot.lang',lang); render();});
  document.getElementById('theme').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; theme=b.dataset.theme; localStorage.setItem('pilot.theme',theme); render();});
  document.getElementById('refresh').addEventListener('click',function(){location.reload();});
  render(); setInterval(tick,1000);
})();
</script>
</body>
</html>
